<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order | RetraLabs</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300D2D3' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 2L3 7v10l9 5 9-5V7l-9-5z'/><path d='M12 22V12'/><path d='M21 7l-9 5-9-5'/><circle cx='12' cy='12' r='3' fill='%2300D2D3' fill-opacity='0.3'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        charcoal: '#0A0A0A',
                        accent: '#00D2D3',
                        premium: '#F5F5F7',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .step-line { width: 2px; background: #e5e7eb; flex-shrink: 0; }
        .step-line.done { background: #00D2D3; }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(0,210,211,0.4); }
            70% { box-shadow: 0 0 0 8px rgba(0,210,211,0); }
            100% { box-shadow: 0 0 0 0 rgba(0,210,211,0); }
        }
        .step-current { animation: pulse-ring 1.5s infinite; }
    </style>
</head>
<body class="bg-premium text-charcoal font-sans antialiased">

    <nav class="fixed top-0 left-0 w-full z-50 bg-premium/80 backdrop-blur-xl border-b border-charcoal/5 py-6">
        <div class="container mx-auto px-6 md:px-12 flex justify-between items-center">
            <a href="/" class="text-2xl font-extrabold tracking-tighter flex items-center gap-3">
                <div class="w-10 h-10 bg-charcoal rounded-xl flex items-center justify-center shadow-lg transform -rotate-6">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L3 7V17L12 22L21 17V7L12 2Z" stroke="#00D2D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 22V12" stroke="#00D2D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M21 7L12 12L3 7" stroke="#00D2D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="12" cy="12" r="3" fill="#00D2D3" fill-opacity="0.3"/>
                    </svg>
                </div>
                <span class="text-charcoal uppercase tracking-[0.1em] text-xl">Retra<span class="font-light">Labs</span><span class="text-accent">.</span></span>
            </a>
            <div class="flex items-center gap-8">
                <a href="/" class="text-sm font-bold uppercase tracking-widest hover:text-accent transition-colors">Home</a>
                <a href="/cart" class="text-sm font-bold uppercase tracking-widest hover:text-accent transition-colors">Cart</a>
            </div>
        </div>
    </nav>

    <main class="min-h-screen pt-40 pb-20">
        <div class="container mx-auto px-6 md:px-12 max-w-3xl">
            <header class="mb-12">
                <h1 class="text-5xl font-extrabold tracking-tight mb-2">Track Order<span class="text-accent">.</span></h1>
                <p class="text-gray-500">Enter your Order ID to see the current status.</p>
            </header>

            <!-- Search bar -->
            <div class="bg-white rounded-[2rem] p-6 border border-charcoal/5 shadow-sm mb-8 flex gap-3">
                <input
                    id="order-id-input"
                    type="text"
                    placeholder="e.g. RL-20260614-A4F2"
                    class="flex-1 bg-gray-50 rounded-xl px-5 py-4 text-sm font-mono font-bold outline-none border border-charcoal/10 focus:border-accent focus:ring-2 focus:ring-accent/20 transition-all uppercase placeholder:normal-case placeholder:font-normal placeholder:text-gray-400"
                />
                <button onclick="trackFromInput()" class="bg-charcoal text-white px-8 py-4 rounded-xl font-bold text-sm hover:bg-accent hover:text-charcoal transition-all">
                    Track
                </button>
            </div>

            <!-- Result area -->
            <div id="result-area"></div>
        </div>
    </main>

    <template id="tpl-not-found">
        <div class="bg-white rounded-[2rem] p-10 border border-charcoal/5 shadow-sm text-center">
            <div class="text-5xl mb-4">🔍</div>
            <h2 class="text-xl font-bold mb-2">Order not found</h2>
            <p class="text-gray-500 text-sm">Double-check your Order ID. It was sent to you via WhatsApp after checkout.</p>
            <a href="/" class="inline-block mt-6 text-accent font-bold text-sm hover:underline">← Back to Home</a>
        </div>
    </template>

    <template id="tpl-error">
        <div class="bg-red-50 rounded-[2rem] p-10 border border-red-100 shadow-sm text-center">
            <h2 class="text-xl font-bold text-red-600 mb-2">Something went wrong</h2>
            <p class="text-gray-500 text-sm">Please try again in a moment.</p>
        </div>
    </template>

    <script>
        const STEPS = [
            { status: 'PENDING',          label: 'Order Placed',        icon: '📋' },
            { status: 'CONFIRMED',        label: 'Confirmed',           icon: '✅' },
            { status: 'SHIPPED',          label: 'Shipped',             icon: '📦' },
            { status: 'OUT_FOR_DELIVERY', label: 'Out for Delivery',    icon: '🛵' },
            { status: 'DELIVERED',        label: 'Delivered',           icon: '🏠' },
            { status: 'COD_COLLECTED',    label: 'Payment Collected',   icon: '💰' },
        ];

        function statusIndex(status) {
            if (status === 'CANCELLED') return -1;
            return STEPS.findIndex(s => s.status === status);
        }

        function fmtDate(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return d.toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function renderResult(data) {
            const currentIdx = statusIndex(data.orderStatus);
            const isCancelled = data.orderStatus === 'CANCELLED';

            const historyMap = {};
            (data.statusHistory || []).forEach(h => { historyMap[h.status] = h; });

            const stepsHtml = STEPS.map((step, i) => {
                const isDone = !isCancelled && i <= currentIdx;
                const isCurrent = !isCancelled && i === currentIdx;
                const histEntry = historyMap[step.status];

                const circleClass = isDone
                    ? `bg-accent text-charcoal ${isCurrent ? 'step-current' : ''}`
                    : 'bg-gray-100 text-gray-400';

                const labelClass = isDone ? 'text-charcoal font-bold' : 'text-gray-400';
                const lineClass = (i < STEPS.length - 1 && !isCancelled && i < currentIdx) ? 'step-line done' : 'step-line';

                return `
                    <div class="flex gap-4 items-start">
                        <div class="flex flex-col items-center" style="min-width:40px;">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg ${circleClass}">${step.icon}</div>
                            ${i < STEPS.length - 1 ? `<div class="${lineClass}" style="height:40px;margin:4px 0;"></div>` : ''}
                        </div>
                        <div class="pt-1 pb-6">
                            <div class="text-sm ${labelClass}">${step.label}</div>
                            ${histEntry ? `<div class="text-xs text-gray-400 mt-0.5">${fmtDate(histEntry.changed_at)}${histEntry.note ? ' — ' + histEntry.note : ''}</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            const cancelledBadge = isCancelled
                ? `<div class="mt-2 inline-flex items-center gap-2 bg-red-50 text-red-600 border border-red-200 rounded-full px-4 py-1.5 text-xs font-bold uppercase tracking-widest">Order Cancelled</div>`
                : '';

            const paymentMethodLabel = data.paymentMethod === 'COD' ? 'Cash on Delivery' : 'Pre-payment (Bank Transfer)';
            const paymentStatusBadge = {
                PENDING:   'bg-amber-50 text-amber-700 border-amber-200',
                RECEIVED:  'bg-green-50 text-green-700 border-green-200',
                COLLECTED: 'bg-accent/10 text-accent border-accent/30',
                FAILED:    'bg-red-50 text-red-600 border-red-200',
            }[data.paymentStatus] || 'bg-gray-100 text-gray-600 border-gray-200';

            const itemsHtml = (data.items || []).map(item => `
                <div class="flex justify-between items-start gap-4">
                    <div>
                        <div class="font-bold">${item.productName}</div>
                        <div class="text-xs text-gray-400 uppercase tracking-wider">${item.quantity} × ${item.dosageMg}mg Kit</div>
                    </div>
                    <div class="font-bold">₹${item.lineTotal.toLocaleString()}</div>
                </div>
            `).join('');

            const codFeeRow = data.codFee > 0
                ? `<div class="flex justify-between text-sm"><span class="text-gray-400">COD Handling Fee</span><span class="font-bold">₹${data.codFee.toLocaleString()}</span></div>`
                : '';

            document.getElementById('result-area').innerHTML = `
                <div class="space-y-6">
                    <!-- Status Header -->
                    <div class="bg-white rounded-[2rem] p-8 border border-charcoal/5 shadow-sm">
                        <div class="flex items-start justify-between gap-4 mb-6">
                            <div>
                                <div class="text-xs font-bold uppercase tracking-[0.2em] text-gray-400 mb-1">Order ID</div>
                                <div class="font-mono font-black text-xl text-charcoal">${data.orderId}</div>
                                <div class="text-xs text-gray-400 mt-1">Placed ${fmtDate(data.createdAt)}</div>
                            </div>
                            <div class="text-right">
                                <div class="text-xs font-bold uppercase tracking-[0.2em] text-gray-400 mb-1">Payment</div>
                                <div class="text-xs font-bold text-charcoal">${paymentMethodLabel}</div>
                                <div class="mt-1">
                                    <span class="inline-block text-[10px] font-bold uppercase tracking-widest border rounded-full px-3 py-1 ${paymentStatusBadge}">${data.paymentStatus}</span>
                                </div>
                            </div>
                        </div>
                        ${cancelledBadge}
                    </div>

                    <!-- Timeline -->
                    <div class="bg-white rounded-[2rem] p-8 border border-charcoal/5 shadow-sm">
                        <h2 class="text-lg font-extrabold tracking-tight mb-6">Delivery Status</h2>
                        ${stepsHtml}
                    </div>

                    <!-- Order Items -->
                    <div class="bg-white rounded-[2rem] p-8 border border-charcoal/5 shadow-sm">
                        <h2 class="text-lg font-extrabold tracking-tight mb-6">Order Details</h2>
                        <div class="space-y-4 mb-6">${itemsHtml}</div>
                        <div class="border-t border-charcoal/5 pt-4 space-y-2">
                            <div class="flex justify-between text-sm"><span class="text-gray-400">Subtotal</span><span class="font-bold">₹${data.subtotal.toLocaleString()}</span></div>
                            <div class="flex justify-between text-sm"><span class="text-gray-400">Research Logistics</span><span class="font-bold">₹${data.deliveryCharge.toLocaleString()}</span></div>
                            ${codFeeRow}
                            <div class="flex justify-between text-base font-black pt-2 border-t border-charcoal/5"><span>Total</span><span>₹${data.totalAmount.toLocaleString()}</span></div>
                        </div>
                    </div>

                    <div class="text-center">
                        <p class="text-xs text-gray-400">Need help? Contact us on <a href="https://wa.me/918217824384" class="text-accent font-bold hover:underline">WhatsApp</a></p>
                    </div>
                </div>
            `;
        }

        async function trackOrder(orderId) {
            const cleanId = orderId.trim().toUpperCase();
            document.getElementById('order-id-input').value = cleanId;
            document.getElementById('result-area').innerHTML = '<div class="text-center py-12 text-gray-400 text-sm">Loading…</div>';
            try {
                const res = await fetch(`/api/track/${encodeURIComponent(cleanId)}`);
                if (res.status === 404) {
                    document.getElementById('result-area').innerHTML = document.getElementById('tpl-not-found').innerHTML;
                    return;
                }
                if (!res.ok) throw new Error();
                renderResult(await res.json());
            } catch {
                document.getElementById('result-area').innerHTML = document.getElementById('tpl-error').innerHTML;
            }
        }

        function trackFromInput() {
            const val = document.getElementById('order-id-input').value;
            if (val.trim()) trackOrder(val);
        }

        document.getElementById('order-id-input').addEventListener('keydown', e => {
            if (e.key === 'Enter') trackFromInput();
        });

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const orderId = params.get('order') || sessionStorage.getItem('lastOrderId');
            if (orderId) trackOrder(orderId);
        });
    </script>
</body>
</html>
